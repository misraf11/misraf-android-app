name: EAS Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
    paths:
      - ".eas-build-trigger"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EAS_PROFILE: ${{ github.event.inputs.profile || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start Android build on EAS
        run: eas build --platform android --profile "$EAS_PROFILE" --non-interactive --no-wait
